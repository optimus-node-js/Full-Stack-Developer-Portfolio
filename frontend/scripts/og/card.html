<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('fonts/space-grotesk-latin-500-normal.woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('fonts/space-grotesk-latin-700-normal.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('fonts/inter-latin-400-normal.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('fonts/inter-latin-500-normal.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/inter-latin-600-normal.woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('fonts/jetbrains-mono-latin-500-normal.woff2'); }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    color: #f8fafc;
    background: #070b18;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 480px at 92% -8%, rgba(139, 92, 246, .42), transparent 65%),
      radial-gradient(640px 460px at -6% 108%, rgba(59, 130, 246, .38), transparent 65%),
      linear-gradient(135deg, #0a1024 0%, #070b18 55%, #0c0a1f 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, .07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(900px 520px at 70% 30%, #000 30%, transparent 80%);
  }
  .frame {
    position: absolute; inset: 0; padding: 52px 64px 46px;
    display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .avatar {
    width: 58px; height: 58px; border-radius: 50%; padding: 3px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 2px solid #070b18; }
  .brand .name { font-family: 'Space Grotesk'; font-weight: 700; font-size: 25px; letter-spacing: -.2px; }
  .brand .role { margin-top: 2px; font-size: 17px; color: #94a3b8; font-weight: 500; }
  .pill {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(16, 185, 129, .12); border: 1px solid rgba(52, 211, 153, .4);
    color: #6ee7b7; font-weight: 600; font-size: 17px;
  }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 5px rgba(52, 211, 153, .2); }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1072px; padding: 22px 0 18px; }
  .dense .sub { font-size: 22px; margin-top: 14px; }
  .dense .chips { margin-top: 20px; }
  .dense .metrics { margin-top: 20px; }
  .home .main { max-width: 690px; padding: 0; }
  .eyebrow {
    font-family: 'JetBrains Mono'; font-weight: 500; font-size: 18px; letter-spacing: 1.5px;
    text-transform: uppercase; color: #93c5fd;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .eyebrow::before { content: ''; display: inline-block; width: 28px; height: 2px; margin-right: 14px; vertical-align: middle; background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
  h1 {
    margin-top: 18px;
    font-family: 'Space Grotesk'; font-weight: 700; font-size: 64px; line-height: 1.06; letter-spacing: -1.6px;
    background: linear-gradient(92deg, #ffffff 0%, #e0e7ff 55%, #c4b5fd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 18px; font-size: 25px; line-height: 1.4; color: #cbd5e1; max-width: 960px; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    padding: 8px 16px; border-radius: 10px; font-size: 17px; font-weight: 500; color: #e2e8f0;
    background: rgba(148, 163, 184, .1); border: 1px solid rgba(148, 163, 184, .22);
  }
  .metrics { margin-top: 28px; display: flex; gap: 14px; }
  .metric {
    padding: 14px 22px; border-radius: 16px; min-width: 170px;
    background: linear-gradient(160deg, rgba(59, 130, 246, .16), rgba(139, 92, 246, .12));
    border: 1px solid rgba(129, 140, 248, .35);
  }
  .metric b { display: block; font-family: 'Space Grotesk'; font-weight: 700; font-size: 34px; line-height: 1.1; }
  .metric span { display: block; margin-top: 3px; font-size: 15px; color: #a5b4fc; font-weight: 500; }

  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 22px; border-top: 1px solid rgba(148, 163, 184, .16);
    font-family: 'JetBrains Mono'; font-weight: 500; font-size: 18px; color: #94a3b8;
  }
  .bottom .url b { color: #e2e8f0; font-weight: 500; }
  .bottom .cta { display: flex; align-items: center; gap: 10px; color: #c4b5fd; }

  .portrait {
    position: absolute; right: 70px; top: 128px;
    width: 360px; height: 360px; border-radius: 50%; padding: 6px;
    background: conic-gradient(from 210deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
    box-shadow: 0 30px 90px rgba(99, 102, 241, .45);
  }
  .portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 6px solid #070b18; }
  .home .hello { margin-top: 18px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 74px; line-height: 1; letter-spacing: -2px; }
  .home .hello + h1 { margin-top: 10px; font-size: 40px; letter-spacing: -.6px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="frame" id="frame">
    <div class="top">
      <div class="brand">
        <div class="avatar"><img src="../../public/profile.jpeg" alt=""></div>
        <div><div class="name">Rahul Vishwakarma</div><div class="role">Senior Full Stack Developer</div></div>
      </div>
      <div class="pill"><i></i>Available now</div>
    </div>
    <div class="main">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="hello" id="hello" hidden>Rahul Vishwakarma</div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="chips" id="chips"></div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="bottom">
      <div class="url"><b>rahul-vishwakarma-portfolio</b>.vercel.app</div>
      <div class="cta">Open portfolio <span>&rarr;</span></div>
    </div>
  </div>
  <div class="portrait" id="portrait" hidden><img src="../../public/profile.jpeg" alt=""></div>

  <script>
    // Filled in by generate-images.mjs via window.render(page).
    window.render = (page) => {
      const c = page.card;
      const home = page.variant === 'home';
      document.body.classList.toggle('home', home);
      document.getElementById('portrait').hidden = !home;
      document.getElementById('hello').hidden = !home;
      document.querySelector('.brand').style.visibility = home ? 'hidden' : 'visible';
      document.getElementById('eyebrow').textContent = c.eyebrow;
      document.getElementById('title').textContent = c.title;
      document.getElementById('sub').textContent = c.subtitle || '';
      const metrics = c.metrics || [];
      const chips = metrics.length ? c.chips.slice(0, 5) : c.chips;
      document.body.classList.toggle('dense', !home && metrics.length > 0);
      document.getElementById('chips').innerHTML = chips.map((t) => `<span class="chip">${t}</span>`).join('');
      document.getElementById('metrics').innerHTML = metrics.map((m) => `<div class="metric"><b>${m.value}</b><span>${m.label}</span></div>`).join('');
      document.getElementById('metrics').style.display = metrics.length ? 'flex' : 'none';

      // Shrink the title, then drop the chips, until everything fits the card.
      const main = document.querySelector('.main');
      const title = document.getElementById('title');
      let size = parseFloat(getComputedStyle(title).fontSize);
      const fits = () => main.scrollHeight <= main.clientHeight + 1 && title.getBoundingClientRect().height <= size * 1.06 * 2 + 2;
      while (!fits() && size > 40) { size -= 2; title.style.fontSize = size + 'px'; }
      if (!fits()) document.getElementById('chips').style.display = 'none';
    };
  </script>
</body>
</html>
